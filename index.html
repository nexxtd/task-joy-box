  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var hsl = localStorage.getItem('accentHsl');
        if (hsl) {
          var rootStyle = document.documentElement.style;
          rootStyle.setProperty('--primary', hsl);
          rootStyle.setProperty('--ring', hsl);
          rootStyle.setProperty('--sidebar-primary', hsl);
          rootStyle.setProperty('--sidebar-ring', hsl);
        }
      } catch (e) {}
    })();
  </script>
