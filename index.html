<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>MyPlanner - Beta v0.1</title>
    <meta name="description" content="MyPlanner Beta v0.1 - A comprehensive task management application with collaboration features, AI insights, and billing capabilities">
    <meta name="author" content="MyPlanner Team" />

    <!-- Non-blocking fonts: preconnect + display=swap (was 4 render-blocking @imports in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Identity Services is only used on /login; warm up the
         connection early so the sign-in button renders faster there. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- TODO: Set the document title to the name of your application -->
    
    <meta property="og:type" content="website" />
    

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MyPlannerApp" />
    
    <meta property="og:title" content="MyPlanner - Beta v0.1">
  <meta name="twitter:title" content="MyPlanner - Beta v0.1">
  <meta property="og:description" content="MyPlanner Beta v0.1 - A comprehensive task management application with collaboration features, AI insights, and billing capabilities">
  <meta name="twitter:description" content="MyPlanner Beta v0.1 - A comprehensive task management application with collaboration features, AI insights, and billing capabilities">
  <script>
    (function () {
      try {
        // Set <html lang/dir> from the saved language before React paints,
        // so a saved non-English language never flashes English first.
        var langRaw = null;
        try { langRaw = localStorage.getItem('language'); } catch (e) {}
        var code = 'en';
        var rtl = false;
        if (langRaw) {
          var m = {
            'English': 'en', 'Español': 'es', 'Français': 'fr', 'Deutsch': 'de',
            'Português': 'pt', 'Italiano': 'it', '中文': 'zh', '日本語': 'ja',
            '한국어': 'ko', 'العربية': 'ar', 'עברית': 'he', 'हिन्दी': 'hi',
            'Русский': 'ru', 'Nederlands': 'nl', 'Türkçe': 'tr', 'Tiếng Việt': 'vi',
            'es': 'es', 'fr': 'fr', 'de': 'de', 'pt': 'pt', 'it': 'it', 'zh': 'zh',
            'ja': 'ja', 'ko': 'ko', 'ar': 'ar', 'he': 'he', 'hi': 'hi', 'ru': 'ru',
            'nl': 'nl', 'tr': 'tr', 'vi': 'vi', 'en': 'en'
          };
          if (m[langRaw]) code = m[langRaw];
        }
        rtl = (code === 'ar' || code === 'he');
        document.documentElement.lang = code;
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
        var hasAuth = !!localStorage.getItem('auth_user_cache');
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        if (!hasAuth) {
          localStorage.removeItem('accentHsl');
          localStorage.removeItem('accentColor');
          return;
        }
        var hsl = localStorage.getItem('accentHsl');
        if (hsl) {
          var rootStyle = document.documentElement.style;
          rootStyle.setProperty('--primary', hsl);
          rootStyle.setProperty('--ring', hsl);
          rootStyle.setProperty('--sidebar-primary', hsl);
          rootStyle.setProperty('--sidebar-ring', hsl);
        }
      } catch (e) {}
    })();
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
